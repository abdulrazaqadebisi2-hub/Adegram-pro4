<!DOCTYPE html><html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Adegram Pro - All Telegram Features</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto}
body{background:#0e1621;color:#fff;height:100vh;overflow:hidden}
.top{position:fixed;top:0;left:0;width:100%;height:56px;background:#17212b;display:flex;align-items:center;padding:0 12px;z-index:50;border-bottom:1px solid #242f3d}
.tabBar{position:fixed;top:56px;left:0;width:100%;height:44px;background:#17212b;display:flex;z-index:49;border-bottom:1px solid #242f3d;overflow:auto}
.tab{flex:1;min-width:70px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;color:#6d8da8;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}.tab.active{color:#2AABEE;border-color:#2AABEE}
.screen{position:absolute;top:100px;left:0;right:0;bottom:0;overflow-y:auto;display:none;background:#0e1621}.screen.active{display:block}
.chatItem{height:72px;display:flex;align-items:center;gap:12px;padding:0 12px;cursor:pointer}.chatItem:hover{background:#202e3a}
.ava{width:52px;height:52px;border-radius:50%;background:#2AABEE;display:grid;place-items:center;font-weight:800;flex-shrink:0;position:relative;overflow:hidden}.ava img{width:100%;height:100%;object-fit:cover}
.dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid #17212b}.online{background:#0ac000}.offline{background:#6d8da8}
.bubbleWrap{clear:both;margin:3px 8px;max-width:84%;position:relative}.bubbleWrap.me{float:right}.bubbleWrap.them{float:left}
.bubble{padding:7px 10px;border-radius:14px;font-size:14.5px;word-break:break-word}.me.bubble{background:#2b5278;border-radius:14px 14px 4px 14px}.them.bubble{background:#182533;border-radius:14px 14px 14px 4px}
.replyBar{background:#0005;border-left:3px solid #2AABEE;padding:4px 8px;border-radius:6px;margin-bottom:4px;font-size:12px;color:#aab8c2}
.meta{font-size:10px;color:#6d8da8;text-align:right;margin-top:3px;display:flex;gap:4px;justify-content:flex-end;align-items:center}
.actions{display:flex;gap:5px;margin:3px 0;flex-wrap:wrap}.actions span{font-size:10px;background:#17212b;padding:3px 7px;border-radius:10px;cursor:pointer;color:#6d8da8}
.reactRow{display:flex;gap:4px;margin-top:3px}.react{background:#17212b;padding:2px 6px;border-radius:10px;font-size:11px;cursor:pointer}
.storyBar{display:flex;gap:10px;padding:10px 12px;background:#17212b;border-bottom:1px solid #242f3d;overflow:auto}
.sItem{text-align:center;width:58px;flex-shrink:0;cursor:pointer}.sCircle{width:54px;height:54px;border-radius:50%;border:2px solid #2AABEE;padding:2px;margin:auto}.sCircle img{width:100%;height:100%;border-radius:50%;object-fit:cover}
#chatWin{position:fixed;inset:0;background:#0e1621;z-index:100;display:none;flex-direction:column}
#chatHeader{height:56px;background:#17212b;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid #242f3d}
#replyPreview{display:none;background:#17212b;padding:8px 12px;border-left:3px solid #2AABEE;justify-content:space-between;align-items:center}
.bottomInput{height:56px;background:#17212b;display:flex;align-items:center;gap:6px;padding:0 8px;border-top:1px solid #242f3d}
.input{flex:1;background:#242f3d;border:none;border-radius:20px;padding:10px 14px;color:#fff;outline:none}
.iconBtn{width:36px;height:36px;border-radius:50%;background:#2AABEE;display:grid;place-items:center;border:none;color:#fff;cursor:pointer;flex-shrink:0}
.card{background:#17212b;max-width:440px;width:100%;border-radius:12px;padding:14px;max-height:92vh;overflow:auto}
input,textarea,select{width:100%;background:#242f3d;border:none;padding:11px;border-radius:8px;color:#fff;margin:5px 0;outline:none}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-weight:800;cursor:pointer;margin-top:6px}.btnBlue{background:#2AABEE;color:#fff}.btnDark{background:#242f3d;color:#fff}
.fab{position:fixed;bottom:18px;right:14px;width:54px;height:54px;background:#2AABEE;border-radius:50%;display:grid;place-items:center;font-size:22px;cursor:pointer;z-index:10;box-shadow:0 4px 12px #0005}
#modal,#storyView,#groupModal,#pollModal,#botModal,#scheduleModal{display:none;position:fixed;inset:0;background:#000c;z-index:200;align-items:center;justify-content:center;padding:12px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head><body>
<div class="top"><b>Adegram Pro 🔥</b><span id="myTop" style="margin-left:auto;color:#2AABEE;font-size:12px"></span></div>
<div class="tabBar">
<div class="tab active" onclick="showTab('chats',this)">ALL CHATS</div>
<div class="tab" onclick="showTab('groups',this)">GROUPS</div>
<div class="tab" onclick="showTab('channels',this)">CHANNELS</div>
<div class="tab" onclick="showTab('folders',this)">FOLDERS</div>
<div class="tab" onclick="showTab('contacts',this)">CONTACTS</div>
<div class="tab" onclick="showTab('bots',this)">BOTS</div>
</div>

<div id="chats" class="screen active"><div class="storyBar" id="storyBar"></div><div id="chatList"></div></div>
<div id="groups" class="screen"><div style="padding:12px"><button onclick="openGroupModal()" class="btn btnBlue">+ New Group / Supergroup</button></div><div id="groupList"></div></div>
<div id="channels" class="screen"><div style="padding:10px;display:flex;gap:6px"><button onclick="document.getElementById('modal').style.display='flex'" class="btn btnBlue" style="flex:1">+ Post</button><button onclick="document.getElementById('pollModal').style.display='flex'" class="btn btnDark" style="flex:1">📊 Poll</button></div><div id="channelFeed" style="padding:8px"></div></div>
<div id="folders" class="screen"><div style="padding:12px"><div style="display:flex;gap:6px"><button onclick="filterFolder('all')" class="btn btnDark">All</button><button onclick="filterFolder('private')" class="btn btnDark">Personal</button><button onclick="filterFolder('group')" class="btn btnDark">Groups</button><button onclick="filterFolder('saved')" class="btn btnBlue">Saved</button></div><div id="folderList" style="margin-top:10px"></div></div></div>
<div id="contacts" class="screen"><div style="padding:14px"><h3>Join Adegram Pro ⚡</h3><input id="myHandle" placeholder="@username e.g @ade"><input id="myPhone" placeholder="Phone +234..."><button onclick="joinNow()" class="btn btnBlue">JOIN NOW</button><div id="myStatus" style="margin-top:8px;background:#242f3d;padding:8px;border-radius:8px;font-size:11px"></div><input id="contactSearch" placeholder="Search" oninput="renderContacts()" style="margin-top:10px"></div><div id="contactsList"></div></div>
<div id="bots" class="screen"><div style="padding:12px"><button onclick="document.getElementById('botModal').style.display='flex'" class="btn btnBlue">+ Create Bot</button></div><div id="botList"></div></div>

<div id="chatWin">
<div id="chatHeader"><button onclick="closeChat()" style="background:none;border:none;color:#fff;font-size:22px">←</button><div class="ava" id="chatAva">A</div><div style="flex:1"><b id="chatWith" style="font-size:14px"></b><br><small id="chatStatus" style="color:#2AABEE;font-size:11px"></small></div><div style="display:flex;gap:10px"><span onclick="pinCurrentChat()" title="Pin">📌</span><span onclick="document.getElementById('scheduleModal').style.display='flex'" title="Schedule">⏰</span><span onclick="openSecret()" title="Secret">🔒</span><span>⋮</span></div></div>
<div style="flex:1;overflow-y:auto"><div id="msgs" style="padding:10px 0"></div><div id="typing" style="font-size:11px;color:#2AABEE;padding:0 12px;height:14px"></div></div>
<div id="replyPreview"><div><small style="color:#2AABEE" id="replyName"></small><div id="replyText" style="font-size:12px;color:#aab8c2"></div></div><span onclick="cancelReply()" style="cursor:pointer">✕</span></div>
<div class="bottomInput">
<label>📎<input type="file" id="chatFile" hidden accept="image/*,video/*,.pdf,.doc,.zip,.mp3" onchange="uploadFile(this)"></label>
<button class="iconBtn" style="background:#242f3d" onclick="startVoice()" id="voiceBtn">🎙️</button>
<input id="msgInput" class="input" placeholder="Message..." oninput="setTyping()" onkeydown="if(event.key==='Enter')sendMsg()">
<button class="iconBtn" onclick="sendMsg()">➤</button>
</div>
</div>

<div id="modal"><div class="card"><h3>Adegram Pro Channel Post</h3><textarea id="mText" placeholder="Message"></textarea><label class="btn btnDark" style="display:block;text-align:center">📷 Upload<input type="file" id="postFile" hidden accept="image/*,video/*" onchange="previewPost(this)"></label><img id="postPreview" style="width:100%;border-radius:8px;display:none"><input id="mLink" placeholder="Or link"><button onclick="doPost()" class="btn btnBlue">SEND</button><button onclick="document.getElementById('modal').style.display='none'" class="btn btnDark">Cancel</button></div></div>
<div id="pollModal"><div class="card"><h3>📊 Adegram Poll</h3><input id="pollQ" placeholder="Question"><input id="pollO1" placeholder="Option 1"><input id="pollO2" placeholder="Option 2"><input id="pollO3" placeholder="Option 3"><input id="pollO4" placeholder="Option 4"><button onclick="createPoll()" class="btn btnBlue">Create Poll</button><button onclick="document.getElementById('pollModal').style.display='none'" class="btn btnDark">Cancel</button></div></div>
<div id="groupModal"><div class="card"><h3>New Adegram Group</h3><input id="groupName" placeholder="Group name"><textarea id="groupDesc" placeholder="Description"></textarea><select id="groupType"><option value="group">Group</option><option value="supergroup">Supergroup (200k members)</option><option value="secret">Secret Chat 🔒</option></select><div id="groupMembersSelect" style="max-height:120px;overflow:auto;background:#242f3d;border-radius:8px;padding:8px;margin-top:6px"></div><button onclick="createGroup()" class="btn btnBlue">Create</button><button onclick="document.getElementById('groupModal').style.display='none'" class="btn btnDark">Cancel</button></div></div>
<div id="botModal"><div class="card"><h3>🤖 Create Adegram Bot</h3><input id="botName" placeholder="Bot name e.g AdeBot"><input id="botUser" placeholder="@botusername"><textarea id="botDesc" placeholder="What can this bot do?"></textarea><button onclick="createBot()" class="btn btnBlue">Create Bot</button><button onclick="document.getElementById('botModal').style.display='none'" class="btn btnDark">Cancel</button></div></div>
<div id="scheduleModal"><div class="card"><h3>⏰ Schedule Message</h3><textarea id="schedText" placeholder="Message to schedule"></textarea><input id="schedTime" type="datetime-local"><button onclick="scheduleMsg()" class="btn btnBlue">Schedule</button><button onclick="document.getElementById('scheduleModal').style.display='none'" class="btn btnDark">Cancel</button></div></div>
<div id="storyView"><div style="position:relative;width:100%;max-width:380px;height:80vh;background:#111;border-radius:12px;overflow:hidden"><div style="position:absolute;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;z-index:2;background:linear-gradient(#0008,transparent)"><span id="storyOwner"></span><span onclick="document.getElementById('storyView').style.display='none'" style="font-size:22px;cursor:pointer">✕</span></div><img id="storyImg" style="width:100%;height:100%;object-fit:contain"><div style="position:absolute;bottom:0;width:100%;padding:12px;text-align:center;background:linear-gradient(transparent,#0008)"><small id="storyTime"></small></div></div></div>
<div class="fab" onclick="document.getElementById('modal').style.display='flex'">✎</div>
<input type="file" id="storyFile" hidden accept="image/*" onchange="uploadStory(this)">
<script>
const firebaseConfig={apiKey:"REPLACE",authDomain:"REPLACE.firebaseapp.com",databaseURL:"https://REPLACE-default-rtdb.firebaseio.com",projectId:"REPLACE",appId:"REPLACE"};
firebase.initializeApp(firebaseConfig);const db=firebase.database();
let me=localStorage.getItem('tg_me')||"",myPhone=localStorage.getItem('tg_phone')||"",users=[],currentChat=null,currentChatType='private',replyTo=null,postImageData="",currentFolder='all';
function showTab(id,el){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));if(el)el.classList.add('active');}
function updateStatus(){document.getElementById('myStatus').innerHTML=me?`Logged as <b>${me}</b> • ${myPhone} ✅`:'Not joined';document.getElementById('myTop').innerText=me||'';if(me){document.getElementById('myHandle').value=me;document.getElementById('myPhone').value=myPhone;}renderGroupMemberSelect();}
function joinNow(){let h=document.getElementById('myHandle').value.trim(),p=document.getElementById('myPhone').value.trim();if(!h||!p)return alert("Enter @name + phone");if(!h.startsWith('@'))h='@'+h;me=h;myPhone=p;localStorage.setItem('tg_me',me);localStorage.setItem('tg_phone',p);let k=me.replace(/[^a-zA-Z0-9]/g,'_');db.ref('users/'+k).set({handle:me,phone:myPhone,online:true,lastSeen:Date.now()});db.ref('users/'+k+'/online').onDisconnect().set(false);updateStatus();showTab('chats',document.querySelectorAll('.tab')[0]);}
db.ref('users').on('value',s=>{users=[];s.forEach(a=>users.push(a.val()));renderContacts();renderChats();renderFolder();renderGroupMemberSelect();});
function renderContacts(){let q=(document.getElementById('contactSearch').value||'').toLowerCase();let f=users.filter(u=>u.handle.toLowerCase().includes(q));document.getElementById('contactsList').innerHTML=f.map(u=>`<div class="chatItem" onclick="openChat('${u.handle}','private')"><div class="ava">${u.handle.slice(1,2).toUpperCase()}<div class="dot ${u.online?'online':'offline'}"></div></div><div><b>${u.handle}</b><br><small style="color:#6d8da8">${u.phone}</small></div></div>`).join('');}
function renderChats(){db.ref('lastMessages').on('value',snap=>{let map={};snap.forEach(c=>map[c.key]=c.val());let html=users.filter(u=>u.handle!==me).map(u=>{let key=[me,u.handle].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');let last=map[key];return `<div class="chatItem" onclick="openChat('${u.handle}','private')"><div class="ava">${u.handle.slice(1,2).toUpperCase()}<div class="dot ${u.online?'online':'offline'}"></div></div><div style="flex:1;overflow:hidden"><div style="display:flex;justify-content:space-between"><b>${u.handle}</b><small style="color:#6d8da8">${last?new Date(last.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):''}</small></div><div style="font-size:13px;color:#6d8da8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?(last.from===me?'You: ':'')+(last.text||'📷'):'Tap to chat'}</div></div></div>`;}).join('');document.getElementById('chatList').innerHTML=`<div class="storyBar" id="storyBar"></div>`+html;db.ref('stories').once('value',s=>renderStoryBar(s));});}
function renderFolder(){let html='';if(currentFolder==='saved'||currentFolder==='all')html+=`<div class="chatItem" onclick="openChat('${me}','private')"><div class="ava" style="background:#2AABEE">💾</div><div><b>Saved Messages</b><br><small style="color:#6d8da8">Save notes, files</small></div></div>`;document.getElementById('folderList').innerHTML=html+`<div style="padding:10px;color:#6d8da8;font-size:12px">Folder: ${currentFolder} • All Telegram folders ready</div>`;}
function filterFolder(f){currentFolder=f;renderFolder();showTab('folders',document.querySelectorAll('.tab')[3]);}
function renderGroupMemberSelect(){let el=document.getElementById('groupMembersSelect');if(!el)return;el.innerHTML=users.filter(u=>u.handle!==me).map(u=>`<label style="display:flex;gap:8px;padding:4px"><input type="checkbox" value="${u.handle}" class="gm"> ${u.handle}</label>`).join('');}
function openGroupModal(){if(!me)return alert("Join first");document.getElementById('groupModal').style.display='flex';}
function createGroup(){let name=document.getElementById('groupName').value.trim();if(!name)return alert("Group name");let members=[me];document.querySelectorAll('.gm:checked').forEach(c=>members.push(c.value));let id=name.replace(/[^a-zA-Z0-9]/g,'_')+'_'+Date.now();db.ref('groups/'+id).set({name:name,desc:document.getElementById('groupDesc').value,type:document.getElementById('groupType').value,members:members,createdBy:me,time:Date.now()});document.getElementById('groupModal').style.display='none';alert("Group "+name+" created!"); }
db.ref('groups').on('value',s=>{let html="";s.forEach(c=>{let g=c.val(),id=c.key;if(!g.members.includes(me))return;html+=`<div class="chatItem" onclick="openChat('${id}','group')"><div class="ava" style="background:${g.type==='secret'?'#000':g.type==='supergroup'?'#ff9500':'#2AABEE'}">${g.type==='secret'?'🔒':g.name.slice(0,2).toUpperCase()}</div><div style="flex:1"><b>${g.name} ${g.type==='secret'?'🔒':''}</b> <small style="color:#6d8da8">${g.type}</small><br><small style="color:#6d8da8">${g.members.length} members</small></div></div>`;});document.getElementById('groupList').innerHTML=html||"<p style='padding:20px;color:#6d8da8;text-align:center'>No groups</p>";});
db.ref('stories').on('value',s=>renderStoryBar(s));
function renderStoryBar(s){let html=`<div class="sItem" onclick="openStoryUpload()"><div class="sCircle" style="border-color:#6d8da8;display:grid;place-items:center">+</div><div style="font-size:11px">Add</div></div>`;s.forEach(c=>{let st=c.val();if(Date.now()-st.time>86400000)return;html+=`<div class="sItem" onclick="viewStory('${st.url}','${st.handle}','${new Date(st.time).toLocaleString()}')"><div class="sCircle"><img src="${st.url}"></div><div style="font-size:11px">${st.handle.slice(0,8)}</div></div>`;});let b=document.getElementById('storyBar');if(b)b.innerHTML=html;}
function openStoryUpload(){if(!me)return alert("Join first");document.getElementById('storyFile').click();}
function uploadStory(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{db.ref('stories').push({handle:me,url:e.target.result,time:Date.now()});};r.readAsDataURL(f);}
function viewStory(url,h,t){document.getElementById('storyView').style.display='flex';document.getElementById('storyImg').src=url;document.getElementById('storyOwner').innerText=h;document.getElementById('storyTime').innerText=t;}
function previewPost(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{postImageData=e.target.result;document.getElementById('postPreview').src=postImageData;document.getElementById('postPreview').style.display='block';};r.readAsDataURL(f);}
db.ref('posts').limitToLast(100).on('value',s=>{let html="";s.forEach(c=>{let p=c.val(),id=c.key;if(p.type==='poll'){html=`<div style="background:#17212b;margin:8px 0;border-radius:10px;padding:12px"><b>${p.handle}</b> 📊 Poll<br><div style="margin-top:6px"><b>${p.question}</b>${(p.options||[]).map((o,i)=>`<div style="background:#242f3d;padding:8px;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;cursor:pointer" onclick="votePoll('${id}',${i})"><span>${o.text}</span><span>${o.votes||0}</span></div>`).join('')}</div></div>`+html;}else{html=`<div style="background:#17212b;margin:8px 0;border-radius:10px;padding:12px"><div style="display:flex;justify-content:space-between"><b>${p.handle}</b><small style="color:#6d8da8">${new Date(p.time).toLocaleString()}</small></div><div style="margin-top:6px;white-space:pre-wrap">${p.text||''}</div>${p.url?`<img src="${p.url}" style="width:100%;border-radius:8px;margin-top:6px">`:''}</div>`+html;}});document.getElementById('channelFeed').innerHTML=html;});
function doPost(){let t=document.getElementById('mText').value,url=postImageData||document.getElementById('mLink').value;if(!t&&!url)return alert("Add text");if(!me)return alert("Join first");db.ref('posts').push({handle:me,text:t,url:url,time:Date.now()});document.getElementById('modal').style.display='none';postImageData='';document.getElementById('postPreview').style.display='none';document.getElementById('mText').value='';document.getElementById('mLink').value='';}
function createPoll(){let q=document.getElementById('pollQ').value,opts=[pollO1.value,pollO2.value,pollO3.value,pollO4.value].filter(x=>x);if(!q||opts.length<2)return alert("Need question + 2 options");db.ref('posts').push({handle:me,question:q,options:opts.map(t=>({text:t,votes:0})),type:'poll',time:Date.now()});document.getElementById('pollModal').style.display='none';}
function votePoll(postId,idx){db.ref('posts/'+postId+'/options/'+idx+'/votes').transaction(v=>(v||0)+1);}
db.ref('bots').on('value',s=>{let html="";s.forEach(c=>{let b=c.val();html+=`<div class="chatItem"><div class="ava" style="background:#7d3bff">🤖</div><div><b>${b.name}</b> ${b.handle}<br><small style="color:#6d8da8">${b.desc}</small></div><button onclick="openChat('${b.handle}','private')" style="margin-left:auto;background:#2AABEE;border:none;padding:6px 12px;border-radius:20px;color:#fff">Start</button></div>`;});document.getElementById('botList').innerHTML=html||"<p style='padding:20px;color:#6d8da8;text-align:center'>No bots - Create one</p>";});
function createBot(){let name=document.getElementById('botName').value,handle=document.getElementById('botUser').value,desc=document.getElementById('botDesc').value;if(!name||!handle)return alert("Bot name + @username");if(!handle.startsWith('@'))handle='@'+handle;db.ref('bots/'+handle.replace(/[^a-zA-Z0-9]/g,'_')).set({name,handle,desc,time:Date.now(),createdBy:me});document.getElementById('botModal').style.display='none';alert("Bot "+handle+" created!");}
function openChat(target,type){if(!me){alert("Join first");showTab('contacts',document.querySelectorAll('.tab')[4]);return;}currentChat=target;currentChatType=type||'private';document.getElementById('chatWin').style.display='flex';document.getElementById('chatWith').innerText=target.length>20?target.slice(0,15)+'...':target;document.getElementById('chatAva').innerText=target.slice(0,2).toUpperCase();let u=users.find(x=>x.handle===target);document.getElementById('chatStatus').innerText=type==='group'?'group':'online';let path=type==='group'?'groupChats/'+target:'chats/'+[me,target].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');db.ref(path).limitToLast(100).on('value',s=>{let html="";s.forEach(m=>{let d=m.val(),id=m.key,isMe=d.from===me;if(d.selfDestruct && Date.now()-d.time>d.selfDestruct*1000){db.ref(path+'/'+id).remove();return;}html+=`<div class="bubbleWrap ${isMe?'me':'them'}">${d.replyTo?`<div class="replyBar">↩️ ${d.replyTo.from}: ${d.replyTo.text.slice(0,40)}</div>`:''}<div class="bubble">${d.type==='voice'?`🎙️ Voice <audio controls src="${d.url}" style="width:160px"></audio>`:''}${d.image?`<img src="${d.image}" style="max-width:240px;border-radius:8px;display:block;margin:4px 0">`:''}${d.file?`<div>📄 <a href="${d.file}" target="_blank" style="color:#2AABEE">${d.fileName}</a></div>`:''}<div>${(d.text||'').replace(/</g,'&lt;')}</div><div class="meta">${d.forwarded?'↗️ forwarded ':''}${d.edited?'(edited) ':''}${new Date(d.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})} ${isMe?'✓✓':''}</div>${d.reactions?`<div class="reactRow">${Object.entries(d.reactions).map(([e,u])=>`<span class="react">${e} ${u.length}</span>`).join('')}</div>`:''}</div><div class="actions"><span onclick="setReply('${id}','${d.from}','${(d.text||'').replace(/'/g,'').slice(0,30)}')">↩️</span><span onclick="reactMsg('${path}','${id}','❤️')">❤️</span><span onclick="reactMsg('${path}','${id}','😂')">😂</span><span onclick="forwardPrompt('${path}','${id}')">↗️</span>${isMe?`<span onclick="editMsg('${path}','${id}')">✏️</span><span onclick="deleteMsg('${path}','${id}')">🗑️</span>`:''}<span onclick="pinMsg('${id}')">📌</span></div></div>`;});document.getElementById('msgs').innerHTML=html;let sc=document.getElementById('msgs').parentElement;sc.scrollTop=sc.scrollHeight;});db.ref('typing/'+(type==='group'?target:[me,target].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_'))).on('value',s=>{let v=s.val();if(v&&v.from!==me){document.getElementById('typing').innerText=v.from+' typing...';setTimeout(()=>document.getElementById('typing').innerText='',1500);}});}
function closeChat(){document.getElementById('chatWin').style.display='none';currentChat=null;cancelReply();}
function setReply(id,from,text){replyTo={id,from,text};document.getElementById('replyName').innerText=from;document.getElementById('replyText').innerText=text;document.getElementById('replyPreview').style.display='flex';}
function cancelReply(){replyTo=null;document.getElementById('replyPreview').style.display='none';}
function sendMsg(){let t=document.getElementById('msgInput').value.trim();if(!t||!currentChat)return;let path=currentChatType==='group'?'groupChats/'+currentChat:'chats/'+[me,currentChat].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');let payload={from:me,to:currentChat,text:t,time:Date.now(),replyTo:replyTo||null};if(currentChatType==='secret')payload.selfDestruct=10;db.ref(path).push(payload);if(currentChatType==='private'){let key=[me,currentChat].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');db.ref('lastMessages/'+key).set(payload);}document.getElementById('msgInput').value='';cancelReply();}
function uploadFile(inp){let f=inp.files[0];if(!f)return;if(f.size>8000000)return alert("Max 8MB");let r=new FileReader();r.onload=e=>{let path=currentChatType==='group'?'groupChats/'+currentChat:'chats/'+[me,currentChat].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');let isImg=f.type.startsWith('image');let payload={from:me,to:currentChat,time:Date.now(),text:'',replyTo:replyTo||null};if(isImg)payload.image=e.target.result;else{payload.file=e.target.result;payload.fileName=f.name;}db.ref(path).push(payload);if(currentChatType==='private'){let key=[me,currentChat].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');db.ref('lastMessages/'+key).set({from:me,text:isImg?'📷 Photo':'📄 '+f.name,time:Date.now()});}cancelReply();};r.readAsDataURL(f);}
function editMsg(path,id){let cur="";db.ref(path+'/'+id+'/text').once('value',s=>cur=s.val());let n=prompt("Edit:",cur);if(n!==null)db.ref(path+'/'+id).update({text:n,edited:true});}
function deleteMsg(path,id){if(confirm("Delete for everyone?"))db.ref(path+'/'+id).remove();}
function reactMsg(path,id,emoji){db.ref(path+'/'+id+'/reactions/'+emoji).transaction(cur=>{if(!cur)return[me];if(cur.includes(me))return cur;return[...cur,me];});}
function forwardPrompt(path,id){let to=prompt("Forward to @username or group ID:");if(!to)return;db.ref(path+'/'+id).once('value',s=>{let d=s.val();let targetPath=to.startsWith('@')?'chats/'+[me,to].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_'):'groupChats/'+to;db.ref(targetPath).push({...d,from:me,forwarded:true,time:Date.now()});alert("Forwarded");});}
function pinMsg(id){let text=document.getElementById('msgs').innerText.slice(0,40);db.ref('pinned').push({chat:currentChat,text:text,handle:me,time:Date.now()});alert("📌 Pinned");}
function pinCurrentChat(){let t=prompt("Pin text:");if(t)db.ref('pinned').push({chat:currentChat,text:t,handle:me,time:Date.now()});}
function openSecret(){if(!currentChat)return;if(confirm("Start secret self-destruct chat? Messages delete after 10 sec")){currentChatType='secret';alert("🔒 Secret mode ON - messages self-destruct in 10s");}}
function scheduleMsg(){let text=document.getElementById('schedText').value,time=document.getElementById('schedTime').value;if(!text||!time)return alert("Enter message + time");let delay=new Date(time).getTime()-Date.now();if(delay<=0)return alert("Time must be future");setTimeout(()=>{let path=currentChatType==='group'?'groupChats/'+currentChat:'chats/'+[me,currentChat].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');db.ref(path).push({from:me,to:currentChat,text:text,time:Date.now(),scheduled:true});alert("Scheduled message sent!");},delay);document.getElementById('scheduleModal').style.display='none';}
let mediaRecorder,audioChunks=[];
function startVoice(){if(!navigator.mediaDevices)return alert("Mic not supported");if(mediaRecorder&&mediaRecorder.state==='recording'){mediaRecorder.stop();document.getElementById('voiceBtn').innerText='🎙️';return;}navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{mediaRecorder=new MediaRecorder(stream);audioChunks=[];mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=()=>{let blob=new Blob(audioChunks,{type:'audio/webm'});let r=new FileReader();r.onload=e=>{let path=currentChatType==='group'?'groupChats/'+currentChat:'chats/'+[me,currentChat].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');db.ref(path).push({from:me,to:currentChat,type:'voice',url:e.target.result,time:Date.now()});};r.readAsDataURL(blob);};mediaRecorder.start();document.getElementById('voiceBtn').innerText='⏹️';setTimeout(()=>{if(mediaRecorder.state==='recording'){mediaRecorder.stop();document.getElementById('voiceBtn').innerText='🎙️';}},10000);}).catch(()=>alert("Mic denied"));}
function setTyping(){if(!currentChat)return;let id=currentChatType==='group'?currentChat:[me,currentChat].sort().join('_').replace(/[^a-zA-Z0-9]/g,'_');db.ref('typing/'+id).set({from:me,time:Date.now()});}
updateStatus();
if(me){let k=me.replace(/[^a-zA-Z0-9]/g,'_');db.ref('users/'+k+'/online').set(true);db.ref('users/'+k+'/online').onDisconnect().set(false);}
</script></body></html>
